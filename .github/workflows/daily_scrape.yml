name: Daily Warframe Data Scrape

# 定时触发机制
on:
  schedule:
    # 每天自动运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许在 GitHub 网页上点击按钮手动触发

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    # 1. 签出代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # 3. 安装 requirements.txt 里写好的依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. 运行爬虫，清洗并生成最新 CSV
    - name: Run scraper
      run: python scraper.py

    # 5. 自动把新抓到的 CSV 数据提交并推送到 GitHub 仓库
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/
        git diff-index --quiet HEAD || git commit -m "Auto: Update daily market data"
        git push